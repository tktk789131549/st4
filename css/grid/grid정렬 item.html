<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>grid 정렬 item</title>
  <style>
    *{margin: 0; padding: 0; box-sizing: border-box;}
    .wrap{margin: 20px;}
    .container{
      background-color: #ff6;
      border: 10px solid #ccc;
    }
    .item{
      background-color: dodgerblue;
      text-align: center;
    }

    .grid-container{
      display: grid;
    gap: 4px;
    }

    .grid-container{
      grid-template-columns: repeat(4, 100px);
      /* justify-content: start;  그리드 컨테이너 안에서 정렬 */
      justify-items: stretch; /*그리드 영역안에서*/
    }
    .container{
      min-height: 350px;
    }
    .grid-container{
      grid-template-rows: repeat(3, 80px);
      /* align-content: normal; ->그리드 컨테이너 안에서 정렬 */
       align-items: stretch; /*그리드 영역안에서*/
    }
   
    .item:nth-child(1),
    .item:nth-child(5){
      grid-column: span 2;
    }
    
  </style>
</head>
<body>
<div class="wrap">
  <div class="container grid-container">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
    <div class="item">5</div>
    <div class="item">6</div>
    <div class="item">7</div>
  </div>
</div>
</body>
</html>
